name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  py_compile:
    name: py_compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Check VERSION helper
        run: |
          python -c "from version import APP_VERSION, read_version; v=open('VERSION').read().strip(); assert APP_VERSION == v == read_version(), (APP_VERSION, v); print(APP_VERSION)"
          python main.py --version
          python server.py --version
